# C0p: GAP-RL-inspired, speed-free grasp policy distilled from the best C0m.
# The deployed observation spec contains no object/belt/joint/TCP velocity,
# contact, force, tactile, torque, or motor-current signal.  Temporal context is
# position/finger/action history, and grasp guidance is a TCP-frame point set.
defaults:
  - config_moving_cube_c0_lift
  - _self_

env:
  privileged_information: false
  grasp_observation: false
  kinematic_grasp_proxy_observation: false
  temporal_history_steps: 0
  position_history_steps: 10
  grasp_point_observation: true
  speed_free_observations: true
  geometry_only_grasp: true
  geometric_slip_penalty: 0.1
  geometric_success_steps: 2
  close_retract_option:
    steps: 0
  grasp_stability:
    hold_steps: 0
    hold_reward: 3.0
    slip_penalty: 0.0
    prelift_max_height: null
    premature_lift_penalty: 0.0
    require_stable_success: false

network:
  architecture: grasp_point_gru
  actor_in_keys: &speed_free_keys
    - [proprio, ee_pos]
    - [proprio, ee_quat]
    - [proprio, gripper_pos]
    - [proprio, joint_pos_rel]
    - [proprio, last_action]
    - [grasp_guidance, points_ee]
    - [position_history, position_action]
  critic_in_keys: *speed_free_keys
  grasp_in_key: [grasp_guidance, points_ee]
  temporal_in_key: [position_history, position_action]
  point_hidden: 64
  temporal_hidden: 64

init_checkpoint: null
init_actor_scale: null
resume_checkpoint: null

collector:
  total_frames: 3_000_000

optim:
  lr: 1.0e-4
  anneal_lr: false

loss:
  entropy_coeff: 0.002
  freeze_actor_scale: true
  freeze_actor_base: false

checkpoint:
  interval_frames: 1_000_000

worker:
  enabled: false

early_stop:
  success_rate: null

logger:
  backend: null
  exp_name: moving_cube_c0p_gap_speed_free

distill:
  teacher_checkpoint: artifacts/moving_cube_static_bowl/teachers/moving_cube_c0m_temporal_geometry_cont_6m_to12m/checkpoints/ppo_teacher_8060928.pt
  # teacher = ordinary behaviour cloning; student = DAgger-style labelling
  # on states visited by the speed-free student itself.
  rollout_policy: teacher
  init_student_checkpoint: null
  epochs_per_rollout: 2
  mini_batch_size: 8192
  checkpoint_interval_frames: 1_000_000

run:
  name: moving_cube_c0p_gap_speed_free_distill
