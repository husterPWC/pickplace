# C0m: sensor-compatible temporal close-and-retract recovery.
# No policy input, reward, or success condition uses contact, force, torque,
# tactile, or motor-current information.  The C0a MLP is imported as the base
# branch (with its former is_grasped input removed); a zero-initialized GRU
# residual learns only the correction made possible by 10-step motion history.
defaults:
  - config_moving_cube_c0_lift
  - _self_

env:
  grasp_observation: false
  kinematic_grasp_proxy_observation: true
  temporal_history_steps: 10
  geometry_only_grasp: true
  geometric_slip_penalty: 0.1
  geometric_success_steps: 2
  close_retract_option:
    # 1024-pair probe: fixed 8-step option scored 57.32% versus 69.24%
    # without it (timeouts 264 vs 109), so it is explicitly rejected.
    steps: 0
    retract_height: 0.035
    trigger_distance: 0.045
    trigger_gripper: -0.5
    follow_gain: 0.5
    max_follow_speed: 0.15
    xy_blend: 0.5
  grasp_stability:
    hold_steps: 0
    hold_reward: 3.0
    slip_penalty: 0.0
    prelift_max_height: null
    premature_lift_penalty: 0.0
    require_stable_success: false

network:
  architecture: temporal_residual_gru
  # Preserve C0a's lexicographic group expansion order, minus is_grasped.
  actor_in_keys:
    - [proprio, ee_pos]
    - [proprio, ee_quat]
    - [proprio, gripper_pos]
    - [proprio, joint_pos_rel]
    - [proprio, joint_vel_rel]
    - [proprio, last_action]
    - [belt, bowl_pos]
    - [belt, speed]
    - [privileged, food_lin_vel]
    - [privileged, food_pos]
    - [privileged, food_quat]
    - [privileged, grasp_proxy]
    - [temporal, motion]
  critic_in_keys:
    - [proprio, ee_pos]
    - [proprio, ee_quat]
    - [proprio, gripper_pos]
    - [proprio, joint_pos_rel]
    - [proprio, joint_vel_rel]
    - [proprio, last_action]
    - [belt, bowl_pos]
    - [belt, speed]
    - [privileged, food_lin_vel]
    - [privileged, food_pos]
    - [privileged, food_quat]
    - [privileged, grasp_proxy]
    - [temporal, motion]
  temporal_in_key: [temporal, motion]
  temporal_hidden: 64
  temporal_actor_residual_limit: 0.25

init_checkpoint: null
init_actor_scale: [-1.91, -1.25, -0.55, -0.84, -0.84, -0.72, -0.73]
resume_checkpoint: null

collector:
  total_frames: 20_000_000

optim:
  lr: 5.0e-5

loss:
  entropy_coeff: 0.002
  freeze_actor_scale: true
  freeze_actor_base: true

checkpoint:
  interval_frames: 2_000_000

worker:
  enabled: false

early_stop:
  success_rate: null
  consecutive_evals: 1

logger:
  exp_name: moving_cube_c0m_temporal_geometry
