# Moving-cube curriculum stage C1: learn interception, grasp, lift and placement
# at a forgiving speed. Home is deliberately deferred until C3, mirroring the
# successful placement-first curriculum used for the reconstructed old task.
defaults:
  - config
  - _self_

env:
  task: FoodRobot-MovingCubeStaticBowl-v0
  arm: franka
  food: cube
  action_mode: ee_delta_pose
  cameras: false
  privileged_information: true
  belt:
    speed: 0.04
    speed_noise: 0.0
    place_window: 10.0      # 0.40 m reach zone
    pallet_start_range: [-0.04, 0.04]
    bowl_offset_x: [-0.01, 0.01]
    bowl_offset_y: [-0.02, 0.02]
  destination_bowl_pos: [0.45, -0.10, 0.0]
  destination_bowl_x_range: [0.45, 0.45]
  destination_bowl_y_range: [-0.10, -0.10]
  reward_set: moving_cube_v1
  reward_weights:
    return_home: 0.0
  success_requires_home: false
  robot_reset:
    position_range: [-0.02, 0.02]
    velocity_range: [0.0, 0.0]

init_checkpoint: null
resume_checkpoint: null

collector:
  total_frames: 600_000_000

optim:
  lr: 3.0e-4

early_stop:
  success_rate: 0.97
  consecutive_evals: 4

logger:
  exp_name: moving_cube_c1
