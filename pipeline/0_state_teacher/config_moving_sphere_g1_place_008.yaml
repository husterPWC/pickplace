# G1: full 0.08 m/s moving-sphere pick and placement into a nearby static
# bowl.  G0-S2c remains frozen on disk; its network is only a warm start.
defaults:
  - config_moving_sphere_g0_s2c_align_follow_speed_008
  - _self_

env:
  task: FoodRobot-MovingSphereStaticBowl-v0
  reward_set: moving_sphere_v1
  success_requires_home: false
  destination_bowl_pos: [0.45, 0.00, 0.0]
  destination_bowl_x_range: [0.44, 0.46]
  destination_bowl_y_range: [-0.01, 0.01]
  belt:
    speed: 0.08
    speed_noise: 0.0
    pallet_start_range: [-0.40, -0.36]
    # These are the sphere offsets on the carrier in the static-bowl task.
    bowl_offset_x: [-0.01, 0.01]
    bowl_offset_y: [-0.01, 0.01]
    visual_upstream_extension: 0.25
    episode_completion_margin: 14.0
    pallet:
      travel_lower: -0.44
  stable_sphere_residual_skill:
    # Retain only a 1 mm / 0.5 mrad per-step grasp correction in G1.  The
    # deterministic zero-residual baseline beat the old G0 policy 54/64 vs
    # 50/64 after position randomization.
    translation_residual_limit: 0.05
    rotation_residual_limit: 0.025
  stable_sphere_pick_place_skill:
    enabled: true
    clear_height: 0.20
    bowl_hover_height: 0.20
    release_height: 0.11
    position_gain: 4.0
    max_position_step: 0.016
    max_translation_action_delta: 0.04
    clear_tolerance: 0.012
    hover_tolerance: 0.018
    release_tolerance: 0.012
    stable_steps: 3
    release_steps: 28
    close_action: -0.15
    open_action: 1.0

collector:
  # Short adaptation with independent checkpoint evaluation; do not assume
  # the final node is best.
  total_frames: 1_000_000

loss:
  entropy_coeff: 0.0
  freeze_actor_scale: true
  action_l1_coeff: 0.005

checkpoint:
  interval_frames: 250_000

worker:
  enabled: false

run:
  name: moving_sphere_g1_place_008_1024_no_rtx
