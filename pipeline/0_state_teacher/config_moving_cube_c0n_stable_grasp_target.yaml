# C0n: GAP-RL-inspired lightweight grasp-target stabilisation.
#
# This keeps C0m's contact-free 10-frame GRU policy and learns only a small
# residual correction from the selected 8.06 M-frame checkpoint.  The reward
# recognises a grasp target only after pose and relative velocity remain stable
# for four control steps, then rewards geometric coupling and penalises loss of
# that confidence.  It never queries contact, force, torque, tactile, or current.
defaults:
  - config_moving_cube_c0m_temporal
  - _self_

env:
  geometric_grasp_stability:
    stable_steps: 4                 # 80 ms at the 50 Hz policy rate
    distance_threshold: 0.04
    relative_speed_threshold: 0.04
    distance_std: 0.04
    relative_speed_std: 0.04
    hold_reward: 1.0
    premature_close_penalty: 0.25
    confidence_loss_penalty: 0.5

# The caller supplies the fixed C0m-best checkpoint.  A fresh optimizer avoids
# carrying the plateaued optimizer state into this short reward probe.
init_checkpoint: null
init_actor_scale: null
resume_checkpoint: null

collector:
  total_frames: 4_000_000

optim:
  lr: 2.0e-6

loss:
  ppo_epochs: 1
  clip_epsilon: 0.05
  entropy_coeff: 0.0
  reference_checkpoint: ${init_checkpoint}
  reference_kl_coeff: 0.5
  reference_mean_kl_coeff: 2.0
  freeze_actor_scale: true
  freeze_actor_base: true

checkpoint:
  interval_frames: 1_000_000

worker:
  enabled: false

early_stop:
  success_rate: null
  consecutive_evals: 1

logger:
  exp_name: moving_cube_c0n_stable_grasp_target
